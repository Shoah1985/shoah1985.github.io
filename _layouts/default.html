<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title | default: site.title }}</title>

  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <link rel="icon" type="image/jpeg" href="{{ '/favicon.jpg' | relative_url }}">
  <script src="{{ '/site.js' | relative_url }}" defer></script>
</head>

<body>

  <header class="site-header">
    <a href="{{ '/' | relative_url }}">Shoah 1985</a>
  </header>

  <main>
    {{ content }}

    {% if page.next_url %}
    <nav class="page-nav">
      <a href="{{ page.next_url | relative_url }}">
        Next: {{ page.next_title }}
      </a>
    </nav>
    {% endif %}
  </main>

</body>
</html>
